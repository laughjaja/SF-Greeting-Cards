<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SF Client Card Video</title>
    <style>
      :root {
        --bg: #f3eee6;
        --overlay: rgba(255, 255, 255, 0.16);
        --overlay-border: rgba(255, 255, 255, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
      }

      body {
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at top, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0) 42%),
          linear-gradient(180deg, rgba(138, 110, 73, 0.08), rgba(138, 110, 73, 0)),
          var(--bg);
        font-family: system-ui, sans-serif;
      }

      .player {
        position: relative;
        width: min(84vw, 420px);
        aspect-ratio: 420 / 546;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: pointer;
      }

      video {
        width: 100%;
        height: 100%;
        display: block;
        border-radius: 8px;
        box-shadow: 0 30px 70px rgba(44, 30, 14, 0.16);
        object-fit: cover;
        background: transparent;
      }

      .overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        pointer-events: none;
        transition: opacity 220ms ease;
      }

      .player.playing .overlay {
        opacity: 0;
      }

      .play-button {
        width: 88px;
        height: 88px;
        border-radius: 999px;
        border: 1px solid var(--overlay-border);
        background: var(--overlay);
        backdrop-filter: blur(10px);
        display: grid;
        place-items: center;
        box-shadow: 0 12px 28px rgba(33, 24, 14, 0.14);
      }

      .play-icon {
        width: 0;
        height: 0;
        margin-left: 6px;
        border-top: 14px solid transparent;
        border-bottom: 14px solid transparent;
        border-left: 22px solid rgba(255, 255, 255, 0.92);
      }

      .pause-icon {
        display: none;
        gap: 8px;
      }

      .pause-icon span {
        width: 8px;
        height: 28px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.92);
      }

      .player.playing .play-icon {
        display: none;
      }

      .player.playing .pause-icon {
        display: flex;
      }
    </style>
  </head>
  <body>
    <button class="player" id="player" type="button" aria-label="Play video">
      <video
        id="video"
        playsinline
        preload="metadata"
        poster="/card-video-poster.png"
      >
        <source src="/card-video.mp4" type="video/mp4" />
        <source src="/card-video.webm" type="video/webm" />
      </video>
      <div class="overlay">
        <div class="play-button" aria-hidden="true">
          <div class="play-icon"></div>
          <div class="pause-icon">
            <span></span>
            <span></span>
          </div>
        </div>
      </div>
    </button>

    <script>
      const player = document.getElementById("player");
      const video = document.getElementById("video");

      const syncState = () => {
        const playing = !video.paused && !video.ended;
        player.classList.toggle("playing", playing);
        player.setAttribute("aria-label", playing ? "Pause video" : "Play video");
      };

      const togglePlayback = async () => {
        if (video.paused || video.ended) {
          if (video.ended) video.currentTime = 0;
          try {
            await video.play();
          } catch (_) {}
        } else {
          video.pause();
        }
        syncState();
      };

      player.addEventListener("click", togglePlayback);
      video.addEventListener("play", syncState);
      video.addEventListener("pause", syncState);
      video.addEventListener("ended", syncState);
      syncState();
    </script>
  </body>
</html>
