<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>SF Client Card Email Template</title>
    <!--[if mso]>
      <style>
        table,
        td,
        p,
        a {
          font-family: Georgia, "Times New Roman", serif !important;
        }
      </style>
    <![endif]-->
    <style>
      body,
      table,
      td,
      p,
      a,
      li {
        -webkit-text-size-adjust: 100%;
        -ms-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        padding: 0;
        width: 100% !important;
        background-color: #f3eee6;
      }

      table {
        border-collapse: collapse;
        mso-table-lspace: 0;
        mso-table-rspace: 0;
      }

      img {
        border: 0;
        outline: none;
        text-decoration: none;
        -ms-interpolation-mode: bicubic;
        display: block;
      }

      @media only screen and (max-width: 620px) {
        .outer {
          width: 100% !important;
        }

        .stack-pad {
          padding-left: 20px !important;
          padding-right: 20px !important;
        }

        .hero-gif {
          width: 100% !important;
          height: auto !important;
        }

        .top-copy {
          font-size: 18px !important;
          line-height: 30px !important;
        }
      }
    </style>
  </head>
  <body style="margin: 0; padding: 0; background-color: #f3eee6;">
    <div style="display: none; max-height: 0; overflow: hidden; mso-hide: all;">
      A short note from Staffing Solutions by Sarah Fell with a seasonal card preview.
      &nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;&nbsp;&zwnj;
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="width: 100%; background-color: #f3eee6;"
    >
      <tr>
        <td align="center" style="padding: 32px 16px;">
          <table
            role="presentation"
            width="600"
            cellpadding="0"
            cellspacing="0"
            class="outer"
            style="
              width: 600px;
              max-width: 600px;
              background-color: #f7f1e7;
              box-shadow: 0 10px 30px rgba(33, 24, 14, 0.08);
            "
          >
            <tr>
              <td
                class="stack-pad"
                style="
                  padding: 36px 48px 24px;
                  background-color: #f7f1e7;
                  border-bottom: 1px solid #deceb6;
                "
              >
                <p
                  class="top-copy"
                  style="
                    margin: 0;
                    font-family: Georgia, 'Times New Roman', serif;
                    font-size: 20px;
                    line-height: 32px;
                    color: #1c1c1c;
                    letter-spacing: 0.01em;
                  "
                >
                  {{CUSTOM_INTRO_TEXT}}
                </p>
              </td>
            </tr>

            <tr>
              <td
                class="stack-pad"
                align="center"
                style="
                  padding: 28px 32px 32px;
                  background: linear-gradient(180deg, #efe4d2 0%, #f7f1e7 100%);
                "
              >
                <a
                  href="https://sf-clientcards.vercel.app/card-video.html"
                  target="_blank"
                  style="text-decoration: none;"
                >
                  <img
                    src="https://sf-clientcards.vercel.app/card-email-small.gif"
                    width="360"
                    height="468"
                    alt="Animated greeting card from Staffing Solutions by Sarah Fell"
                    class="hero-gif"
                    style="
                      width: 360px;
                      max-width: 100%;
                      height: auto;
                      display: block;
                      margin: 0 auto;
                    "
                  />
                </a>
              </td>
            </tr>

            <tr>
              <td
                class="stack-pad"
                style="
                  background-color: #1a1a1a;
                  padding: 28px 24px 34px;
                  text-align: center;
                "
              >
                <p
                  style="
                    margin: 0 0 18px;
                    font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
                    font-size: 14px;
                    line-height: 20px;
                    color: #d4d4d4;
                  "
                >
                  📍 Ontario-first, Canada-wide
                </p>

                <table
                  role="presentation"
                  width="100%"
                  cellpadding="0"
                  cellspacing="0"
                  style="width: 100%;"
                >
                  <tr>
                    <td
                      style="
                        height: 1px;
                        background-color: #a98523;
                        font-size: 0;
                        line-height: 0;
                      "
                    >
                      &nbsp;
                    </td>
                  </tr>
                </table>

                <p
                  style="
                    margin: 18px 0 0;
                    font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
                    font-size: 12px;
                    line-height: 20px;
                    color: #9b9b9b;
                  "
                >
                  © 2024 Staffing Solutions by Sarah Fell Inc. &nbsp; | &nbsp; Serving
                  Ontario's Industrial Sector Since 2013
                </p>

                <p style="margin: 18px 0 0;">
                  <a
                    href="https://staffingsolutionsbysarahfell.vercel.app"
                    style="
                      font-family: Arial, 'Helvetica Neue', Helvetica, sans-serif;
                      font-size: 12px;
                      line-height: 18px;
                      color: #c6a64a;
                      text-decoration: none;
                    "
                    >staffingsolutionsbysarahfell.vercel.app</a
                  >
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
