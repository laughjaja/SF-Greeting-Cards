<body style="margin:0; padding:0; background-color:#f5f5f3; -webkit-font-smoothing:antialiased;">

  <div style="display:none; max-height:0; overflow:hidden; opacity:0; mso-hide:all; font-size:1px; line-height:1px; color:#f5f5f3;">
    A note from Sarah Fell &#8199;&#65279;&#847; &#8199;&#65279;&#847; &#8199;&#65279;&#847;

  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f5f5f3; margin:0; padding:0;">
    <tr>
      <td align="center" style="padding:40px 16px 48px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" class="outer-table" style="width:100%; max-width:600px; border-collapse:collapse;">

          <tr>
            <td align="center" style="padding:24px 24px 10px 24px; background-color:#ffffff;">
              <img src="https://raw.githubusercontent.com/laughjaja/sarah-fell-website/websitev2/public/S-logo%20sf.png"

                   class="logo-img"

          </tr>

          <tr>
            <td align="center" style="padding:8px 24px 4px 24px; background-color:#ffffff;">
              <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:16px; letter-spacing:2.4px; text-transform:uppercase; color:#5a5a58;">
                From Sarah Fell
              </p>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:10px 24px 22px 24px; background-color:#ffffff;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="44">
                <tr>
                  <td style="height:1px; background-color:#d8d8d4; font-size:1px; line-height:1px;">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:0 20px 0 20px; background-color:#ffffff;">
              <!-- Non-Outlook: animated hero -->
              <!--[if !mso]><!-->
              <img src="ANIMATED_HERO_GIF_URL"
                   alt="A greeting from Sarah Fell"
                   width="560"
                   class="hero-img"
                   style="display:block; width:100%; max-width:560px; height:auto; border:0; background-color:#ffffff;" />
              <!--<![endif]-->
              <!-- Outlook fallback -->
              <!--[if mso]>
              <img src="STATIC_FALLBACK_IMAGE_URL"
                   alt="A greeting from Sarah Fell"
                   width="560"
                   style="display:block; width:560px; height:auto; border:0;" />

          </tr>

          <tr>
            <td align="center" class="inner-pad" style="padding:24px 40px 0 40px; background-color:#ffffff;">
              <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:24px; color:#2f2f2d; text-align:center;">
                A thoughtful note, prepared with care.
              </p>
            </td>
          </tr>

          <tr>
            <td align="center" style="padding:24px 24px 28px 24px; background-color:#ffffff;">
              <p style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:16px; color:#7a7a76;">

              </p>
            </td>
          </tr>

        </table>
      </td>
